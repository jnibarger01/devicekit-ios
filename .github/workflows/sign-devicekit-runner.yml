name: Sign DeviceKit Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-runner:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build unsigned DeviceKit IPAs
        run: make ipa-unsigned

      - name: Restore signing material
        env:
          P12_BASE64: ${{ secrets.DEVICEKIT_P12_BASE64 }}
          RUNNER_PROFILE_BASE64: ${{ secrets.DEVICEKIT_RUNNER_PROFILE_BASE64 }}
          XCTEST_PROFILE_BASE64: ${{ secrets.DEVICEKIT_XCTEST_PROFILE_BASE64 }}
        run: |
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$RUNNER_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/runner.mobileprovision"
          printf '%s' "$XCTEST_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/xctest.mobileprovision"

      - name: Import Apple development certificate
        env:
          P12_PASSWORD: ${{ secrets.DEVICEKIT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/devicekit.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/signing.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"/ {print $2; exit}')"

          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Decode provisioning profiles
        run: |
          security cms -D -i "$RUNNER_TEMP/runner.mobileprovision" > "$RUNNER_TEMP/runner-profile.plist"
          security cms -D -i "$RUNNER_TEMP/xctest.mobileprovision" > "$RUNNER_TEMP/xctest-profile.plist"

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])

          def extract(name):
              src = temp / f"{name}-profile.plist"
              with src.open("rb") as f:
                  profile = plistlib.load(f)

              entitlements = profile["Entitlements"]
              team = profile["TeamIdentifier"][0]
              app_id = entitlements["application-identifier"]

              prefix = team + "."
              if not app_id.startswith(prefix):
                  raise RuntimeError(f"{name}: unexpected application-identifier {app_id}")

              bundle_id = app_id[len(prefix):]

              with (temp / f"{name}.entitlements").open("wb") as f:
                  plistlib.dump(entitlements, f)

              return bundle_id

          runner_id = extract("runner")
          xctest_id = extract("xctest")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a") as f:
              f.write(f"RUNNER_BUNDLE_ID={runner_id}\n")
              f.write(f"XCTEST_BUNDLE_ID={xctest_id}\n")

          print("Runner bundle:", runner_id)
          print("XCTest bundle:", xctest_id)
          PY

      - name: Sign runner and nested XCTest bundle
        run: |
          WORK="$RUNNER_TEMP/devicekit-runner"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q build/export/devicekit-ios-runner.ipa -d "$WORK"

          APP="$(find "$WORK/Payload" -maxdepth 1 -type d -name '*Runner.app' -print -quit)"
          XCTEST="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"

          test -d "$APP"
          test -d "$XCTEST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier $RUNNER_BUNDLE_ID" \
            "$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier $XCTEST_BUNDLE_ID" \
            "$XCTEST/Info.plist"

          cp "$RUNNER_TEMP/runner.mobileprovision" "$APP/embedded.mobileprovision"
          cp "$RUNNER_TEMP/xctest.mobileprovision" "$XCTEST/embedded.mobileprovision"

          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} +

          python3 <<PY > "$RUNNER_TEMP/nested-code.txt"
          from pathlib import Path

          root = Path(r'''$APP''')
          items = list(root.rglob("*.framework")) + list(root.rglob("*.dylib"))
          items.sort(key=lambda p: len(p.parts), reverse=True)

          for item in items:
              print(item)
          PY

          while IFS= read -r ITEM; do
            [ -z "$ITEM" ] && continue
            /usr/bin/codesign \
              --force \
              --sign "$SIGNING_IDENTITY" \
              --timestamp=none \
              "$ITEM"
          done < "$RUNNER_TEMP/nested-code.txt"

          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --entitlements "$RUNNER_TEMP/xctest.entitlements" \
            --generate-entitlement-der \
            --timestamp=none \
            "$XCTEST"

          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --entitlements "$RUNNER_TEMP/runner.entitlements" \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          /usr/bin/codesign --verify --strict --verbose=4 "$XCTEST"
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"

          mkdir -p output
          (
            cd "$WORK"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/output/devicekit-ios-runner-signed.ipa" Payload
          )

      - name: Upload signed runner IPA
        uses: actions/upload-artifact@v5
        with:
          name: devicekit-ios-runner-signed
          path: output/devicekit-ios-runner-signed.ipa
          retention-days: 4
